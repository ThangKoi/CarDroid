name: Build CarDroid (2-panel UI)

# Chay thu cong: tab Actions -> "Build CarDroid (2-panel UI)" -> Run workflow.
# Neu repo co file *.patch (o thu muc goc hoac trong patches/), workflow se ap patch truoc khi build.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI patch(es)
        run: |
          patches=$(find . -maxdepth 2 -name '*.patch' -not -path './.git/*' | sort)
          if [ -z "$patches" ]; then
            echo "::warning::No .patch file found - building the unmodified app"
          else
            for p in $patches; do
              echo "Applying $p"
              git apply --verbose "$p" || { echo "::error::$p does not apply to this version of the code"; exit 1; }
            done
          fi
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cardroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
